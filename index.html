<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>9/22 昼飲みマップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* --- Leaflet core CSS (inlined, trimmed) --- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}

.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile::selection{background:transparent}

.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}

.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.35);border-radius:6px}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);width:34px;height:34px;line-height:34px;display:block;text-align:center;text-decoration:none;font-size:18px}
.leaflet-bar a:first-child{border-radius:6px 6px 0 0}.leaflet-bar a:last-child{border-radius:0 0 6px 6px;border-bottom:none}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);margin:0;padding:0 5px;font-size:10px;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-control-scale-line{border:2px solid var(--muted);border-top:none;line-height:1.1;padding:2px 5px 1px;font-size:11px;white-space:nowrap;box-sizing:border-box;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;color:var(--ink);white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:11px;font-weight:700}
.leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none}

/* --- tokens --- */
:root{
  --ground:#eef1f4; --surface:#ffffff; --ink:#18202e; --muted:#5f6a7d; --line:#d6dce4;
  --lunch:#d9820b; --lunch-bg:#fff1d9; --night:#3b4bb0; --night-bg:#e5e8fb;
  --accent:#c2352b; --good:#1f7a4d; --warn:#a15c00; --warn-bg:#fff4e0;
  --mapbase:#e7eaee; --mapline:#c3cad4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161d; --surface:#1b212b; --ink:#e8ecf2; --muted:#9aa5b6; --line:#2c3441;
    --lunch:#f0a93a; --lunch-bg:#3a2a10; --night:#8e9cf5; --night-bg:#232a4d;
    --accent:#ef6a5d; --good:#5cc592; --warn:#f0b35a; --warn-bg:#35270f;
    --mapbase:#1e252f; --mapline:#39424f;
  }
}
:root[data-theme="dark"]{
  --ground:#12161d; --surface:#1b212b; --ink:#e8ecf2; --muted:#9aa5b6; --line:#2c3441;
  --lunch:#f0a93a; --lunch-bg:#3a2a10; --night:#8e9cf5; --night-bg:#232a4d;
  --accent:#ef6a5d; --good:#5cc592; --warn:#f0b35a; --warn-bg:#35270f;
  --mapbase:#1e252f; --mapline:#39424f;
}

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
header.top{flex-shrink:0;padding:10px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--ground)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:20px;margin:0;letter-spacing:.02em}
.brand .date{font-size:12px;color:var(--muted)}
.brand .date b{color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

.mapwrap{position:relative;flex:0 0 46%;min-height:240px;margin:0 16px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--mapbase)}
#map{position:absolute;inset:0;background:var(--mapbase)}
.map-note{position:absolute;left:10px;bottom:10px;z-index:900;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:3px 8px;border-radius:6px;max-width:70%}
.legend{position:absolute;right:10px;top:10px;z-index:900;display:flex;gap:6px;font-size:11px;font-weight:700}
.legend span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.l{background:var(--lunch)}.dot.n{background:var(--night)}

.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .15s}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.pin.lunch{background:var(--lunch)}.pin.night{background:var(--night)}
.pin.sel{transform:rotate(-45deg) scale(1.3);border-color:var(--ink);z-index:1000}
.stn{background:var(--ink);color:var(--ground);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translate(-50%,-50%);display:inline-block}

path.ring{stroke:var(--muted);fill:var(--mapline)}
path.rail{stroke:var(--muted)}
.filters{flex-shrink:0;display:flex;gap:6px;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.sortsel{flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px}

.list{flex:1 1 auto;overflow-y:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;align-content:start}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}
.item:hover{border-color:var(--muted)}
.item.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.num{grid-row:span 3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.num.lunch{background:var(--lunch)}.num.night{background:var(--night)}
.item .nm{font-weight:700;font-size:15px;line-height:1.35}
.item .meta{font-size:12px;color:var(--muted);grid-column:2/4}
.item .one{font-size:12.5px;grid-column:2/4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rate{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.rate small{font-weight:500;color:var(--muted);font-size:10px;display:block;text-align:right;line-height:1.1}
.star{color:#e0a100}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:4px;margin-right:4px}
.tag.lunch{background:var(--lunch-bg);color:var(--lunch)}.tag.night{background:var(--night-bg);color:var(--night)}
.tag.g{background:var(--ground);color:var(--ink);border:1px solid var(--line)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.empty{color:var(--muted);padding:20px 0}

/* detail sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:2000;max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:62%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet .hd{display:flex;gap:10px;align-items:flex-start;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
.sheet .hd .sub{font-size:12px;color:var(--muted);margin-top:2px}
.close{margin-left:auto;border:1px solid var(--line);background:var(--ground);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:0 0 auto;font-size:16px;line-height:1}
.sheet .bd{overflow-y:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score .src{font-size:11px;color:var(--muted)}
.summary{font-size:14px;line-height:1.75;margin:0}
dl.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted);font-weight:700}
dl.kv dd{margin:0}
.callout{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
.callout b{color:var(--warn)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid var(--ink);color:var(--ink);text-decoration:none;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.links a.primary{background:var(--ink);color:var(--ground)}
.foot{flex-shrink:0;font-size:11px;color:var(--muted);padding:0 16px 10px}

@media (min-width:900px){
  .mapwrap{flex-basis:52%}
  .sheet{left:auto;right:24px;bottom:24px;top:auto;width:420px;border-radius:16px;border-bottom:1px solid var(--line);max-height:80%}
}
@media (prefers-reduced-motion:reduce){.sheet,.pin{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>昼飲みマップ</h1>
      <span class="date"><b>9/22(火・祝)</b> シルバーウィーク</span>
    </div>
    <div class="seg" role="group" aria-label="エリア切替">
      <button id="area-fukushima" data-area="fukushima" aria-pressed="true">大阪・福島</button>
      <button id="area-koshienguchi" data-area="koshienguchi" aria-pressed="false">甲子園口</button>
    </div>
  </header>

  <div class="mapwrap">
    <div id="map" aria-label="地図"></div>
    <div class="legend"><span><i class="dot l"></i>昼12時〜</span><span><i class="dot n"></i>夜のみ</span></div>
    <div class="map-note" id="mapnote" hidden></div>
  </div>

  <div class="filters" id="filters">
    <button class="chip" id="f-all" data-f="all" aria-pressed="true">すべて</button>
    <button class="chip" id="f-lunch" data-f="lunch" aria-pressed="false">昼12時〜OK</button>
    <button class="chip" id="f-night" data-f="night" aria-pressed="false">夜のみ</button>
    <select class="sortsel" id="sort" aria-label="並び順">
      <option value="num">番号順</option>
      <option value="rate">評価が高い順</option>
      <option value="genre">ジャンル順</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sh-title">
  <div class="grab"></div>
  <div class="hd">
    <div>
      <h2 id="sh-title"></h2>
      <div class="sub" id="sh-sub"></div>
    </div>
    <button class="close" id="sh-close" aria-label="閉じる">✕</button>
  </div>
  <div class="bd" id="sh-body"></div>
</div>

<script>
const AREAS = /*DATA_START*/{"fukushima":{"label":"大阪・福島","asof":"(サンプル表示)","center":[34.697,135.4868],"zoom":16,"stations":[{"name":"JR福島","lat":34.69735,"lng":135.4868},{"name":"阪神福島","lat":34.69655,"lng":135.48805},{"name":"JR新福島","lat":34.69505,"lng":135.489}],"shops":[{"id":"f1","no":1,"name":"サンプル酒場A","genre":"立ち飲み","type":"lunch","hours":"12:00〜23:00","hoursShort":"12:00〜23:00","holiday":"不定休","holidayNote":"祝日も営業(サンプル)","rating":4.1,"reviews":320,"summary":"これはレイアウト確認用のダミーです。本番では口コミの総括がここに入ります。","catch":"レイアウト確認用のダミーデータです","must":"名物メニュー","budget":"¥2,000","tips":"予約不可・現金のみ など","address":"大阪市福島区福島","station":"JR福島 徒歩2分","lat":34.6979,"lng":135.4858},{"id":"f2","no":2,"name":"サンプルバルB","genre":"バル","type":"lunch","hours":"11:30〜22:00","hoursShort":"11:30〜22:00","holiday":"月曜","rating":4.3,"reviews":210,"summary":"ダミー","catch":"ダミー","budget":"¥3,000","address":"大阪市福島区","station":"阪神福島 徒歩3分","lat":34.6962,"lng":135.4892},{"id":"f3","no":3,"name":"サンプル中華C","genre":"中華","type":"lunch","hours":"11:00〜21:00","holiday":"水曜","tabelog":"3.52","summary":"ダミー","catch":"ダミー","address":"大阪市福島区","station":"JR新福島 徒歩4分","lat":34.6945,"lng":135.487},{"id":"f4","no":4,"name":"サンプル焼鳥D","genre":"焼鳥","type":"night","hours":"17:00〜24:00","holiday":"日曜","rating":4.5,"reviews":150,"summary":"ダミー","catch":"ダミー","address":"大阪市福島区","station":"JR福島 徒歩5分","lat":34.699,"lng":135.488},{"id":"f5","no":5,"name":"サンプルビストロE","genre":"フレンチ","type":"night","hours":"18:00〜23:00","holiday":"火曜","rating":4.4,"reviews":90,"summary":"ダミー","catch":"ダミー","address":"大阪市福島区","station":"JR福島 徒歩6分","lat":34.6955,"lng":135.4845}]},"koshienguchi":{"label":"甲子園口","asof":"(サンプル表示)","center":[34.7386,135.3749],"zoom":16,"stations":[{"name":"JR甲子園口","lat":34.7386,"lng":135.3749}],"shops":[{"id":"k1","no":1,"name":"サンプル居酒屋","genre":"居酒屋","type":"lunch","hours":"12:00〜22:00","holiday":"不定休","rating":4,"reviews":100,"summary":"ダミー","catch":"ダミー","address":"西宮市甲子園口","station":"JR甲子園口 徒歩2分","lat":34.7392,"lng":135.3755}]}}/*DATA_END*/;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let area = 'fukushima', filter = 'all', sort = 'num', selId = null;
try { const a = localStorage.getItem('hn-area'); if (a && AREAS[a]) area = a; } catch(e){}

const map = L.map('map', {zoomControl:true, attributionControl:true}).setView([34.697,135.487], 16);
L.control.scale({imperial:false, position:'bottomright'}).addTo(map);
const base = L.layerGroup().addTo(map);
const pins = L.layerGroup().addTo(map);
const markers = {};

// Real tiles when allowed; fall back to a plain vector base if the host blocks images.
let tilesOk = null;
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
});
tiles.on('tileload', () => { tilesOk = true; $('#mapnote').hidden = true; });
tiles.on('tileerror', () => { if (tilesOk) return; tilesOk = false; showNote(); });
tiles.addTo(map);
function showNote(){
  const n = $('#mapnote');
  n.textContent = '簡易マップ表示中(円=駅から徒歩5分/10分)。道順は各店の「Googleマップ」から';
  n.hidden = false;
}

const UNSURE = /要確認|要問い合わせ|不明|未確認/;
function unsure(v){ return v==null || v==='' || UNSURE.test(String(v)); }
function val(v){ return unsure(v) ? '<span class="tag warn">要問い合わせ</span>' : esc(v); }
function rateOf(s){ return s.rating ?? null; }
function gmaps(s){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + ' ' + (s.address || '')); }

function drawBase(){
  base.clearLayers();
  const A = AREAS[area];
  const c = A.center;
  [[400,'徒歩5分'],[800,'徒歩10分']].forEach(([r,label]) => {
    L.circle(c, {radius:r, className:'ring', weight:1.5, dashArray:'4 5', fill:false, interactive:false}).addTo(base);
  });
  (A.lines||[]).forEach(l => L.polyline(l.pts, {className:'rail', weight:3, opacity:.55, dashArray:'10 6', interactive:false}).addTo(base));
  (A.stations||[]).forEach(st => {
    L.marker([st.lat, st.lng], {icon:L.divIcon({className:'', html:`<span class="stn">${esc(st.name)}</span>`, iconSize:[0,0]}), interactive:false, zIndexOffset:-100}).addTo(base);
  });
}

function visible(){
  const A = AREAS[area];
  let list = A.shops.filter(s => filter==='all' || s.type===filter);
  if (sort==='rate') list = [...list].sort((a,b) => (rateOf(b)??-1)-(rateOf(a)??-1));
  if (sort==='genre') list = [...list].sort((a,b) => a.genre.localeCompare(b.genre,'ja'));
  return list;
}

function drawPins(){
  pins.clearLayers();
  for (const k in markers) delete markers[k];
  const ids = new Set(visible().map(s=>s.id));
  AREAS[area].shops.forEach(s => {
    if (!ids.has(s.id) || s.lat==null) return;
    const icon = L.divIcon({className:'', html:`<div class="pin ${s.type}${s.id===selId?' sel':''}"><span>${s.no}</span></div>`, iconSize:[28,28], iconAnchor:[14,28]});
    const m = L.marker([s.lat, s.lng], {icon, title:s.name, zIndexOffset: s.id===selId?1000:0}).addTo(pins);
    m.bindTooltip(s.name, {direction:'top', offset:[0,-26]});
    m.on('click', () => select(s.id, false));
    markers[s.id] = m;
  });
}

function rateHtml(s){
  const r = rateOf(s);
  if (r!=null) return `<div class="rate"><span class="star">★</span>${r.toFixed(1)}<small>Google${s.reviews?` ${s.reviews}件`:''}</small></div>`;
  if (s.tabelog) return `<div class="rate">${esc(s.tabelog)}<small>食べログ</small></div>`;
  return `<div class="rate"><small>評価 —</small></div>`;
}

function drawList(){
  const list = visible();
  $('#list').innerHTML = list.length ? list.map(s => `
    <button class="item${s.id===selId?' sel':''}" id="it-${s.id}" data-id="${s.id}">
      <span class="num ${s.type}">${s.no}</span>
      <span class="nm">${esc(s.name)}</span>
      ${rateHtml(s)}
      <span class="meta"><span class="tag ${s.type}">${s.type==='lunch'?'昼OK':'夜のみ'}</span><span class="tag g">${esc(s.genre)}</span>${val(s.hoursShort||s.hours)}</span>
      <span class="one">${esc(s.catch||s.summary)}</span>
    </button>`).join('') : '<div class="empty">該当するお店がありません</div>';
  const A = AREAS[area];
  $('#foot').textContent = `${A.label}:${A.shops.length}店掲載(昼OK ${A.shops.filter(s=>s.type==='lunch').length}/夜のみ ${A.shops.filter(s=>s.type==='night').length})。${A.asof}時点の調べ。営業時間・祝日営業は変わることがあるので、行く前に電話かGoogleマップで確認を。`;
}

function detail(s){
  const r = rateOf(s);
  $('#sh-title').textContent = s.name;
  $('#sh-sub').innerHTML = `<span class="tag ${s.type}">${s.type==='lunch'?'昼12時〜OK':'夜のみ'}</span><span class="tag g">${esc(s.genre)}</span> ${esc(s.station||'')}`;
  const score = [
    r!=null ? `<div><div class="big"><span class="star">★</span>${r.toFixed(1)}</div><div class="src">Google口コミ${s.reviews?`(${s.reviews}件)`:''}</div></div>` : '',
    s.tabelog ? `<div><div class="big" style="font-size:22px">${esc(s.tabelog)}</div><div class="src">食べログ</div></div>` : '',
    s.budget ? `<div><div class="big" style="font-size:18px">${esc(s.budget)}</div><div class="src">予算の目安</div></div>` : ''
  ].join('');
  $('#sh-body').innerHTML = `
    ${score?`<div class="score">${score}</div>`:''}
    ${s.holidayNote?`<div class="callout"><b>9/22(祝)メモ:</b> ${esc(s.holidayNote)}</div>`:''}
    <p class="summary">${esc(s.summary)}</p>
    <dl class="kv">
      <dt>営業時間</dt><dd>${val(s.hours)}</dd>
      <dt>定休日</dt><dd>${val(s.holiday)}</dd>
      ${s.must?`<dt>名物</dt><dd>${esc(s.must)}</dd>`:''}
      ${s.tips?`<dt>知っとく</dt><dd>${esc(s.tips)}</dd>`:''}
    </dl>
    <div class="links">
      <a class="primary" href="${gmaps(s)}" target="_blank" rel="noopener">Googleマップで開く</a>
      ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">お店の情報</a>`:''}
    </div>`;
  $('#sheet').classList.add('open');
  $('#sh-body').scrollTop = 0;
}

function select(id, fromList){
  selId = id;
  const s = AREAS[area].shops.find(x=>x.id===id);
  drawPins(); drawList();
  if (s.lat!=null) map.panTo([s.lat, s.lng], {animate:true});
  if (!fromList) document.getElementById('it-'+id)?.scrollIntoView({block:'nearest', behavior:'smooth'});
  detail(s);
}

function setArea(a){
  area = a; selId = null;
  try { localStorage.setItem('hn-area', a); } catch(e){}
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.area===a));
  $('#sheet').classList.remove('open');
  const A = AREAS[a];
  drawBase(); drawPins(); drawList();
  const pts = A.shops.filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]).concat([A.center]);
  map.fitBounds(pts, {padding:[30,30], maxZoom:17});
  $('#list').scrollTop = 0;
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setArea(b.dataset.area)));
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c===b));
  drawPins(); drawList();
}));
$('#sort').addEventListener('change', e => { sort = e.target.value; drawList(); });
$('#list').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) select(it.dataset.id, true); });
$('#sh-close').addEventListener('click', () => { $('#sheet').classList.remove('open'); selId=null; drawPins(); drawList(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') $('#sh-close').click(); });

setArea(area);
</script>
</body></html>
