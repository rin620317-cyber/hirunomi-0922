<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>アイコン案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
body{margin:0;padding:24px;background:#1f2430;font-family:"Zen Kaku Gothic New",sans-serif;color:#eef}
h1{font-size:18px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px}
.icon{width:160px;height:160px;border-radius:36px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.lbl{font-weight:700;font-size:15px}
.desc{font-size:12px;color:#b8c0d0;text-align:center;max-width:210px;line-height:1.5}
.home{margin-top:28px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.home .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.home svg{width:60px;height:60px;border-radius:14px}
</style></head><body>
<h1>昼飲みマップ アイコン案(「昼」「酒」)</h1>
<div class="grid">

<div class="card"><svg class="icon" viewBox="0 0 512 512"><rect width="512" height="512" fill="#f5b400"/>
<circle cx="256" cy="256" r="178" fill="#ffd84a"/>
<g stroke="#ffd84a" stroke-width="22" stroke-linecap="round">
<line x1="256" y1="18" x2="256" y2="58"/><line x1="256" y1="454" x2="256" y2="494"/><line x1="18" y1="256" x2="58" y2="256"/><line x1="454" y1="256" x2="494" y2="256"/>
<line x1="88" y1="88" x2="116" y2="116"/><line x1="396" y1="396" x2="424" y2="424"/><line x1="424" y1="88" x2="396" y2="116"/><line x1="116" y1="396" x2="88" y2="424"/></g>
<text x="256" y="330" text-anchor="middle" font-family="Dela Gothic One" font-size="220" fill="#1b2240">酒</text>
</svg><div class="lbl">A. 太陽に「酒」</div><div class="desc">昼の太陽の真ん中に「酒」。遠目でも一番目立つ、明るい黄色</div></div>

<div class="card"><svg class="icon" viewBox="0 0 512 512"><rect width="512" height="512" fill="#1b2240"/>
<path d="M0 0H512L0 512Z" fill="#f5b400"/>
<text x="150" y="222" text-anchor="middle" font-family="Dela Gothic One" font-size="170" fill="#1b2240">昼</text>
<text x="362" y="448" text-anchor="middle" font-family="Dela Gothic One" font-size="170" fill="#f5b400">酒</text>
</svg><div class="lbl">B. 昼/酒 の斜め分割</div><div class="desc">アプリの配色(昼=黄、夜=藍)そのまま。「昼」と「酒」を斜めに分けた大胆なデザイン</div></div>

<div class="card"><svg class="icon" viewBox="0 0 512 512"><rect width="512" height="512" fill="#2a1a12"/>
<rect x="206" y="40" width="100" height="30" rx="8" fill="#3a2a1f"/><rect x="206" y="442" width="100" height="30" rx="8" fill="#3a2a1f"/>
<ellipse cx="256" cy="256" rx="160" ry="192" fill="#d8312a"/>
<g stroke="#a3201b" stroke-width="6" fill="none"><ellipse cx="256" cy="256" rx="160" ry="120"/><ellipse cx="256" cy="256" rx="160" ry="60"/><ellipse cx="256" cy="256" rx="160" ry="160"/></g>
<text x="256" y="238" text-anchor="middle" font-family="Yuji Syuku" font-size="140" fill="#fff6e0">昼</text>
<text x="256" y="378" text-anchor="middle" font-family="Yuji Syuku" font-size="140" fill="#fff6e0">酒</text>
</svg><div class="lbl">C. 赤ちょうちん「昼酒」</div><div class="desc">居酒屋の赤ちょうちんに筆文字で「昼酒」。大衆酒場らしさが一番出る</div></div>

<div class="card"><svg class="icon" viewBox="0 0 512 512"><rect width="512" height="512" fill="#2f6fdd"/>
<circle cx="392" cy="120" r="70" fill="#ffd84a"/>
<rect x="128" y="176" width="200" height="252" rx="26" fill="#ffc933"/>
<rect x="128" y="150" width="200" height="66" rx="30" fill="#fffaf0"/>
<circle cx="160" cy="160" r="30" fill="#fffaf0"/><circle cx="300" cy="158" r="28" fill="#fffaf0"/>
<path d="M328 224h36a36 36 0 0 1 36 36v70a36 36 0 0 1-36 36h-36" fill="none" stroke="#ffc933" stroke-width="30"/>
<text x="228" y="376" text-anchor="middle" font-family="Dela Gothic One" font-size="120" fill="#1b2240">昼</text>
</svg><div class="lbl">D. 青空にジョッキ</div><div class="desc">青空と太陽、ビールジョッキに「昼」。いちばん楽しげでポップ</div></div>

<div class="card"><svg class="icon" viewBox="0 0 512 512"><rect width="512" height="512" fill="#fbf6ea"/>
<circle cx="256" cy="256" r="200" fill="none" stroke="#c2352b" stroke-width="18"/>
<text x="256" y="238" text-anchor="middle" font-family="Dela Gothic One" font-size="150" fill="#c2352b">昼</text>
<text x="256" y="400" text-anchor="middle" font-family="Dela Gothic One" font-size="150" fill="#1b2240">酒</text>
</svg><div class="lbl">E. はんこ風「昼酒」</div><div class="desc">朱色の丸枠に「昼」「酒」を縦に。シンプルで和風、落ち着いた印象</div></div>

</div>
<div class="home" id="home"></div>
<script>
// ホーム画面に並べたときの大きさ
document.querySelectorAll('.card').forEach((c,i)=>{ const s=c.querySelector('svg').cloneNode(true); s.removeAttribute('class'); const d=document.createElement('div'); d.className='app'; d.appendChild(s); d.append('ABCDE'[i]+' 昼飲み'); document.getElementById('home').appendChild(d); });
</script>
</body></html>
